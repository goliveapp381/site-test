<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop T-Shirt" data-editable="meta_description" data-editable-type="text">
    <meta name="theme-color" content="#123d25" data-editable="theme_color" data-editable-type="color">
    <title data-editable="page_title" data-editable-type="text">Shop T-Shirt</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
    <link rel="stylesheet" href="css/velocity-effects.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/velocity-background.css">
</head>

<body data-template="shop-tshirt" data-template-version="1.0.0">

    <!-- حزم كثيرة من الأسلاك المنحنية المضيئة في الخلفية -->
    <div class="site-wires-bg" id="siteWiresBg" aria-hidden="true">
        <span class="wire-wave w-1"></span>
        <span class="wire-wave w-2"></span>
        <span class="wire-wave w-3"></span>
        <span class="wire-wave w-4"></span>
        <span class="wire-wave w-5"></span>
        <span class="wire-wave w-6"></span>
        <span class="wire-wave w-7"></span>
        <span class="wire-wave w-8"></span>
        <span class="wire-wave w-9"></span>
        <span class="wire-wave w-10"></span>
        <span class="wire-wave w-11"></span>
        <span class="wire-wave w-12"></span>
        <span class="wire-wave w-13"></span>
        <span class="wire-wave w-14"></span>
        <span class="wire-wave w-15"></span>
        <span class="wire-wave w-16"></span>
    </div>

    <main class="site-stage">
        <h1 class="site-top-title" data-editable="site_title" data-editable-type="text">
            SHOP T-SHIRT
        </h1>

        <div class="monitor-layout">
            <!-- الأصناف على اليسار كتابة فقط -->
            <aside class="side-categories-column" aria-label="Clothing categories" data-editable="side_categories" data-editable-type="section">
                <button type="button" class="side-cat-btn active" data-category-filter="all" data-editable="cat_all" data-editable-type="text">
                    All Items
                </button>
                <button type="button" class="side-cat-btn" data-category-filter="tshirt" data-editable="cat_tshirt" data-editable-type="text">
                    T-Shirt
                </button>
                <button type="button" class="side-cat-btn" data-category-filter="pants" data-editable="cat_pants" data-editable-type="text">
                    Pants
                </button>
                <button type="button" class="side-cat-btn" data-category-filter="hoodie" data-editable="cat_hoodie" data-editable-type="text">
                    Hoodie
                </button>
                <button type="button" class="side-cat-btn" data-category-filter="jacket" data-editable="cat_jacket" data-editable-type="text">
                    Jacket
                </button>
            </aside>

            <!-- شاشة مستطيلة مع العمود المائل الواصل حتى للسقف -->
            <div class="monitor-device">
                <div class="monitor-bezel">
                    <div class="monitor-screen-empty" id="monitorScreenSlot">
                        <div class="angled-rack-rail" id="angledRackRail" aria-hidden="true"></div>
                    </div>
                </div>
                <div class="monitor-stand" aria-hidden="true"></div>
                <div class="monitor-base" aria-hidden="true"></div>
            </div>
        </div>
    </main>

    <script src="js/products.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/wishlist.js" defer></script>
    <script src="js/filters.js" defer></script>
    <script src="js/animations.js" defer></script>
    <script src="js/velocity-core.js" defer></script>
    <script src="js/velocity-cart-ui.js" defer></script>
    <script src="js/velocity-ui.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/velocity-background.js" defer></script>
    <script src="js/template-bridge.js" defer></script>
</body>

</html>
