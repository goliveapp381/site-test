<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop T-Shirt - Interactive Monitor Rack" data-editable="meta_description" data-editable-type="text">
    <meta name="theme-color" content="#123d25" data-editable="theme_color" data-editable-type="color">
    <title data-editable="page_title" data-editable-type="text">Shop T-Shirt</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            position: relative;
            background:
                linear-gradient(180deg, rgba(8, 12, 10, 0.52) 0%, rgba(8, 12, 10, 0.22) 50%, rgba(6, 10, 8, 0.62) 100%),
                linear-gradient(135deg, #4ade80 0%, #166534 45%, #062814 100%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 0 18px 60px;
            overflow-x: hidden;
        }

        button { font: inherit; color: inherit; }
        :focus-visible { outline: 3px solid #bbf7d0; outline-offset: 3px; }

        /* ---------- Background wires (unchanged) ---------- */
        .site-wires-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .wire-wave {
            position: absolute; width: 820px; height: 280px; border-radius: 50%;
            border: 2px solid transparent; border-top-color: rgba(163, 230, 53, 0.52);
            filter: drop-shadow(0 0 10px rgba(163, 230, 53, 0.24));
            animation: wireFloat 4.6s ease-in-out infinite;
        }
        @keyframes wireFloat { 0%, 100% { translate: 0px 0px; } 50% { translate: 10px -12px; } }
        .w-1  { top: -6%;  left: 24%; transform: rotate(-42deg); border-top-color: rgba(217, 249, 157, 0.55); animation-delay: 0s; }
        .w-2  { top: -3%;  left: 27%; transform: rotate(-39deg); border-top-color: rgba(163, 230, 53, 0.55);  animation-delay: 0.25s; }
        .w-3  { top: 0%;   left: 30%; transform: rotate(-36deg); border-top-color: rgba(74, 222, 128, 0.5);   animation-delay: 0.5s; }
        .w-4  { top: 3%;   left: 33%; transform: rotate(-33deg); border-top-color: rgba(217, 249, 157, 0.45); animation-delay: 0.75s; }
        .w-5  { top: 6%;   left: 36%; transform: rotate(-30deg); border-top-color: rgba(163, 230, 53, 0.45);  animation-delay: 1s; }
        .w-6  { top: 9%;   left: 39%; transform: rotate(-27deg); border-top-color: rgba(74, 222, 128, 0.4);   animation-delay: 1.25s; }
        .w-7  { top: 12%;  left: 42%; transform: rotate(-24deg); border-top-color: rgba(217, 249, 157, 0.35); animation-delay: 1.5s; }
        .w-8  { top: 15%;  left: 45%; transform: rotate(-21deg); border-top-color: rgba(163, 230, 53, 0.35);  animation-delay: 1.75s; }
        .w-9  { bottom: 20%; left: 26%; transform: rotate(22deg); border-bottom-color: rgba(163, 230, 53, 0.45); border-top-color: transparent; animation-delay: 0.2s; }
        .w-10 { bottom: 16%; left: 29%; transform: rotate(25deg); border-bottom-color: rgba(217, 249, 157, 0.5);  border-top-color: transparent; animation-delay: 0.45s; }
        .w-11 { bottom: 12%; left: 32%; transform: rotate(28deg); border-bottom-color: rgba(74, 222, 128, 0.5);   border-top-color: transparent; animation-delay: 0.7s; }
        .w-12 { bottom: 8%;  left: 35%; transform: rotate(31deg); border-bottom-color: rgba(163, 230, 53, 0.55); border-top-color: transparent; animation-delay: 0.95s; }
        .w-13 { bottom: 4%;  left: 38%; transform: rotate(34deg); border-bottom-color: rgba(217, 249, 157, 0.55); border-top-color: transparent; animation-delay: 1.2s; }
        .w-14 { bottom: 0%;  left: 41%; transform: rotate(37deg); border-bottom-color: rgba(74, 222, 128, 0.5);   border-top-color: transparent; animation-delay: 1.45s; }
        .w-15 { bottom: -4%; left: 44%; transform: rotate(40deg); border-bottom-color: rgba(163, 230, 53, 0.45); border-top-color: transparent; animation-delay: 1.7s; }
        .w-16 { bottom: -8%; left: 47%; transform: rotate(43deg); border-bottom-color: rgba(217, 249, 157, 0.4);  border-top-color: transparent; animation-delay: 1.95s; }

        /* ---------- Page ---------- */
        .site-stage {
            position: relative; z-index: 1; width: 100%; max-width: 1520px; margin: 0 auto;
            display: flex; flex-direction: column; align-items: center; gap: 18px;
        }

        /* TOP SPACE: intentionally empty area above the brand block (room for title animation) */
        .top-space { width: 100%; height: clamp(56px, 12vh, 130px); flex: none; }

        .brand { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 10px; max-width: 100%; }

        .logo { display: flex; align-items: center; gap: 12px; }
        .logo-mark { width: 52px; height: 52px; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.35)); }
        .logo-mark .logo-bg { fill: rgba(240, 253, 244, 0.1); stroke: rgba(187, 247, 208, 0.55); stroke-width: 1.6; }
        .logo-draw {
            fill: none; stroke: #bbf7d0; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1; stroke-dashoffset: 0;
        }
        .logo-draw.fill { fill: rgba(134, 239, 172, 0.28); }
        .logo-text { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.3em; color: #dcfce7; }

        .site-top-title {
            font-size: clamp(1.7rem, 4.6vw, 3.4rem); font-weight: 900; letter-spacing: 0.14em;
            color: #f0fdf4; text-align: center; white-space: nowrap;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
        }
        .title-bar {
            display: block; width: min(260px, 50vw); height: 3px; border-radius: 3px;
            background: linear-gradient(90deg, transparent, #86efac, transparent); transform-origin: center;
        }

        /* Main hero grid (no monitor, open page) */
        .hero-grid {
            --info-w: 320px;
            width: 100%; display: grid; gap: 22px; align-items: center;
            grid-template-columns: 130px minmax(0, 1fr) var(--info-w);
            grid-template-areas: "cats stage info";
            scroll-margin-top: 16px;
        }

        .side-categories-column { grid-area: cats; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
        .side-cat-btn {
            background: transparent; border: none; padding: 4px 0; color: #f8fafc; font-size: 1.05rem;
            font-weight: 800; letter-spacing: 0.03em; cursor: pointer; text-align: left;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .side-cat-btn:hover, .side-cat-btn.active { color: #86efac; transform: translateX(6px) scale(1.06); }

        /* 27deg rail stage */
        .rack-stage {
            grid-area: stage; position: relative; width: 100%;
            height: clamp(430px, 68vh, 650px); overflow: hidden;
            touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none;
        }
        .rack-stage.dragging { cursor: grabbing; }

        .rack-plane {
            position: absolute; left: 0; top: 0; width: 0; height: 0;
            transform: rotate(27deg); transform-origin: 0 0;
        }
        .angled-rack-rail {
            position: absolute; top: -2px; height: 4px; border-radius: 999px;
            background: linear-gradient(90deg, #f0fdf4, #bbf7d0 60%, #86efac);
            box-shadow: 0 0 14px rgba(187, 247, 208, 0.55), 0 3px 6px rgba(0, 0, 0, 0.35);
            transform-origin: left center; z-index: 0;
        }

        .rack-hanger-card {
            position: absolute; left: 0; top: 0; width: var(--tw, 200px); margin-left: calc(var(--tw, 200px) / -2);
            transform-origin: 50% 0; background: none; border: 0; padding: 0; cursor: pointer;
            visibility: hidden; will-change: transform, opacity; -webkit-tap-highlight-color: transparent;
        }
        .rk-hook { position: absolute; left: 50%; top: -14px; width: 22px; height: 30px; margin-left: -11px; z-index: 2; pointer-events: none; }
        .rk-hook path { stroke: #dcfce7; }
        .rk-tag {
            position: absolute; left: 50%; top: -38px; transform: translateX(-50%) scale(.8); opacity: 0;
            background: #052e16; color: #86efac; font-size: 0.7rem; font-weight: 900; letter-spacing: 0.08em;
            padding: 3px 9px; border-radius: 999px; white-space: nowrap; transition: opacity .25s ease, transform .25s ease; pointer-events: none;
        }
        .rack-hanger-card.active .rk-tag { opacity: 1; transform: translateX(-50%) scale(1); }

        .rack-hanger-card .gm {
            display: block; width: 100%; height: calc(var(--tw, 200px) * 1.1); margin-top: 12px;
            object-fit: contain; transition: transform .22s ease, filter .25s ease; pointer-events: none;
        }
        .rack-hanger-card.near .gm { filter: drop-shadow(10px 8px 11px rgba(0, 0, 0, 0.4)); }
        .rack-hanger-card:hover .gm { transform: translateY(-6px); }
        .rack-hanger-card.active .gm {
            filter: drop-shadow(0 0 2px #86efac) drop-shadow(0 0 3px #86efac) drop-shadow(0 16px 16px rgba(0, 0, 0, 0.5));
            transform: translateY(-4px);
        }
        .rack-hanger-card.pulled .gm {
            filter: drop-shadow(0 0 3px #bbf7d0) drop-shadow(0 0 14px rgba(134, 239, 172, 0.7)) drop-shadow(0 30px 28px rgba(0, 0, 0, 0.6));
        }

        /* Info card (right side) */
        .info-card {
            grid-area: info; width: 100%; padding: 18px 20px;
            background: rgba(4, 24, 13, 0.55); border: 1px solid rgba(255, 255, 255, 0.16);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            border-radius: 16px; display: flex; flex-direction: column; gap: 10px; color: #f0fdf4;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .info-count { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.2em; color: #bbf7d0; }
        .info-title { font-size: clamp(1.1rem, 1.8vw, 1.5rem); font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.25; }
        .info-rule { width: 22px; height: 1px; background: #86efac; }
        .info-meta { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; color: #86efac; }
        .info-desc { font-size: 0.8rem; line-height: 1.6; color: #d1fae5; }
        .info-specs { display: grid; gap: 6px; }
        .info-specs div { display: grid; grid-template-columns: 78px 1fr; gap: 8px; align-items: center; font-size: 0.72rem; }
        .info-specs dt { color: #a7f3d0; letter-spacing: 0.1em; font-weight: 700; }
        .info-specs dd { font-weight: 800; letter-spacing: 0.04em; }
        .color-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.6); margin-right: 6px; vertical-align: -1px; }
        .size-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .size-chip {
            min-width: 36px; padding: 6px 9px; border-radius: 8px; border: 1px solid #bbf7d0; background: transparent;
            color: #f0fdf4; font-size: 0.74rem; font-weight: 800; cursor: pointer; transition: background .15s ease, color .15s ease;
        }
        .size-chip[aria-pressed="true"] { background: #86efac; color: #052e16; }
        .detail-price-tag { font-size: 1.5rem; font-weight: 900; color: #86efac; }
        .screen-btn {
            background: rgba(255, 255, 255, 0.14); color: #fff; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 9px;
            padding: 8px 12px; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: transform .15s ease, background .15s ease;
        }
        .screen-btn:hover { transform: translateY(-1px); background: rgba(255, 255, 255, 0.22); }
        .screen-btn:active { transform: scale(.97); }
        .screen-btn.green { background: #22c55e; border-color: #22c55e; color: #052e16; width: 100%; font-size: 0.86rem; padding: 11px 12px; }
        .info-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .info-nav .screen-btn { padding: 6px 16px; font-size: 1rem; line-height: 1; }
        .edit-only { display: none; gap: 6px; }
        body.edit-mode .edit-only { display: flex; }
        .edit-only .screen-btn { flex: 1; font-size: 0.7rem; }

        /* ---------- Catalog: category bar + 2 horizontal shelves ---------- */
        .catalog { width: 100%; margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
        .cat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .cat-bar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
        .cat-bar::-webkit-scrollbar { display: none; }
        .cat-tab {
            flex: none; padding: 9px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.08); color: #f0fdf4; font-weight: 800; font-size: 0.86rem; letter-spacing: 0.04em;
            cursor: pointer; transition: background .2s ease, color .2s ease, transform .2s ease;
        }
        .cat-tab:hover { transform: translateY(-2px); }
        .cat-tab.active { background: #f0fdf4; color: #14532d; border-color: #f0fdf4; }
        .cat-count { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.2em; color: #bbf7d0; }
        .shelf-label { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.24em; color: #86efac; margin: 2px 4px -6px; }
        .shelf {
            position: relative; display: flex; gap: 12px; overflow-x: auto; padding: 8px 4px 14px;
            scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: rgba(187, 247, 208, 0.5) transparent;
        }
        .mini {
            flex: 0 0 152px; scroll-snap-align: start; position: relative; padding: 10px; border-radius: 14px; cursor: pointer;
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.16);
            display: flex; flex-direction: column; gap: 4px; text-align: left;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
            content-visibility: auto; contain-intrinsic-size: 152px 214px;
        }
        .mini:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.14); }
        .mini.active { border-color: #86efac; background: rgba(134, 239, 172, 0.16); transform: translateY(-4px); }
        .mini-img { aspect-ratio: 1; display: grid; place-items: center; }
        .mini .gm { width: 82%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 8px rgba(0, 0, 0, 0.35)); pointer-events: none; }
        .mini-idx { font-size: 0.64rem; font-weight: 900; color: #86efac; letter-spacing: 0.1em; }
        .mini-name { font-size: 0.74rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .mini-price { font-size: 0.82rem; font-weight: 900; color: #86efac; }
        .mini-add {
            width: 28px; height: 28px; border-radius: 50%; border: 0; background: #22c55e; color: #052e16;
            font-weight: 900; font-size: 1rem; line-height: 1; cursor: pointer; transition: transform .15s ease;
        }
        .mini-add:hover { transform: scale(1.12); }
        .empty-shelf { padding: 22px; color: #bbf7d0; font-size: 0.85rem; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .wire-wave { animation: none; }
            *, *::before, *::after { transition: none !important; }
        }

        @media (max-width: 1100px) {
            .hero-grid {
                grid-template-columns: minmax(0, 1fr) 300px;
                grid-template-areas: "cats cats" "stage info";
                align-items: start;
            }
            .side-categories-column { flex-direction: row; flex-wrap: wrap; gap: 16px; }
        }

        @media (max-width: 820px) {
            body { padding: 0 12px 50px; }
            .hero-grid { grid-template-columns: minmax(0, 1fr); grid-template-areas: "cats" "stage" "info"; }
            .rack-stage { height: 390px; }
            .side-cat-btn { font-size: 0.92rem; }
            .logo-text { letter-spacing: 0.2em; }
            .mini { flex-basis: 136px; }
        }
    </style>
</head>

<body data-template="shop-tshirt" data-template-version="1.1.0">

    <div class="site-wires-bg" aria-hidden="true">
        <span class="wire-wave w-1"></span><span class="wire-wave w-2"></span><span class="wire-wave w-3"></span><span class="wire-wave w-4"></span>
        <span class="wire-wave w-5"></span><span class="wire-wave w-6"></span><span class="wire-wave w-7"></span><span class="wire-wave w-8"></span>
        <span class="wire-wave w-9"></span><span class="wire-wave w-10"></span><span class="wire-wave w-11"></span><span class="wire-wave w-12"></span>
        <span class="wire-wave w-13"></span><span class="wire-wave w-14"></span><span class="wire-wave w-15"></span><span class="wire-wave w-16"></span>
    </div>

    <main class="site-stage">
        <!-- TOP SPACE: reserved empty area for title animation work -->
        <div class="top-space" aria-hidden="true"></div>

        <header class="brand">
            <div class="logo" id="logo">
                <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
                    <rect class="logo-bg" x="2" y="2" width="60" height="60" rx="17"/>
                    <path class="logo-draw" pathLength="1" d="M32 22v-5c0-2.2 3-3 3-5.6a3.5 3.5 0 1 0-7 0"/>
                    <path class="logo-draw fill" pathLength="1" d="M24 22 13 29l5 9 4-2v18h20V36l4 2 5-9-11-7q-8 7-16 0Z"/>
                </svg>
                <span class="logo-text" id="logoText" data-editable="logo_text" data-editable-type="text">SHOP T-SHIRT</span>
            </div>
            <h1 class="site-top-title" id="siteTitle" data-editable="site_title" data-editable-type="text">SHOP T-SHIRT</h1>
            <span class="title-bar" id="titleBar" aria-hidden="true"></span>
        </header>

        <section class="hero-grid" id="hero">
            <aside class="side-categories-column" aria-label="Categories">
                <button type="button" class="side-cat-btn active" data-cat="all">All Items</button>
                <button type="button" class="side-cat-btn" data-cat="tshirt">T-Shirt</button>
                <button type="button" class="side-cat-btn" data-cat="pants">Pants</button>
                <button type="button" class="side-cat-btn" data-cat="hoodie">Hoodie</button>
                <button type="button" class="side-cat-btn" data-cat="jacket">Jacket</button>
            </aside>

            <!-- 27deg display rail, open on the page -->
            <div class="rack-stage" id="rackTrack" role="listbox" aria-label="Hanging rack, use arrow keys">
                <div class="rack-plane" id="rackPlane">
                    <div class="angled-rack-rail" id="rackRail" aria-hidden="true"></div>
                </div>
            </div>

            <aside class="info-card" id="teeDetailsBar" aria-live="polite">
                <div class="info-count" data-counter id="rackCounter">01 / 40</div>
                <h2 class="info-title" id="detailTitle">Studio Tee #01</h2>
                <div class="info-rule" aria-hidden="true"></div>
                <div class="info-meta" id="detailMeta">NO. 01 • T-SHIRT</div>
                <p class="info-desc" id="detailDesc"></p>
                <dl class="info-specs">
                    <div><dt>MATERIAL</dt><dd id="detailMaterial"></dd></div>
                    <div><dt>COLOR</dt><dd id="detailColor"></dd></div>
                </dl>
                <div class="size-row" id="detailSizes" role="group" aria-label="Sizes"></div>
                <div class="detail-price-tag" id="detailPrice">$39</div>
                <button type="button" class="screen-btn green" id="addTeeBtn">Add to Cart (<span id="cartQty">0</span>)</button>
                <div class="edit-only">
                    <button type="button" class="screen-btn" id="imgReplaceBtn">Replace image</button>
                    <button type="button" class="screen-btn" id="imgClearBtn">Remove image</button>
                    <input type="file" id="imgInput" accept="image/*" hidden>
                </div>
                <div class="info-nav">
                    <button type="button" class="screen-btn" id="prevTeeBtn" aria-label="Previous">←</button>
                    <span class="info-count" data-counter>01 / 40</span>
                    <button type="button" class="screen-btn" id="nextTeeBtn" aria-label="Next">→</button>
                </div>
            </aside>
        </section>

        <!-- Catalog: category bar + two horizontal shelves -->
        <section class="catalog" id="catalog" aria-label="Catalog">
            <div class="cat-head">
                <nav class="cat-bar" id="catBar" aria-label="Category navigation">
                    <button type="button" class="cat-tab active" data-cat="all">All Items</button>
                    <button type="button" class="cat-tab" data-cat="tshirt">T-Shirt</button>
                    <button type="button" class="cat-tab" data-cat="pants">Pants</button>
                    <button type="button" class="cat-tab" data-cat="hoodie">Hoodie</button>
                    <button type="button" class="cat-tab" data-cat="jacket">Jacket</button>
                </nav>
                <span class="cat-count" id="catCount">40 ITEMS</span>
            </div>
            <div class="shelf-label">ROW A</div>
            <div class="shelf" id="shelfA" role="list"></div>
            <div class="shelf-label">ROW B</div>
            <div class="shelf" id="shelfB" role="list"></div>
        </section>
    </main>

    <script>
        (() => {
            const MAX_ITEMS = 40;
            const CATEGORIES = ['tshirt', 'pants', 'hoodie', 'jacket'];
            const QUALITIES = ['320 GSM Combed Cotton', '340 GSM Heavy Jersey', '290 GSM Ring-Spun Cotton', '310 GSM Boxy Weave'];
            const DESCRIPTIONS = {
                tshirt: 'Relaxed everyday tee cut from dense, soft-hand cotton with a clean ribbed collar.',
                pants: 'Tapered cargo pant with articulated knees and a washed, structured finish.',
                hoodie: 'Heavyweight brushed-fleece hoodie with a boxy fit and a double-lined hood.',
                jacket: 'Lightweight shell jacket with a water-repellent finish and matte hardware.'
            };
            const COLORS = [
                ['Crimson', '#d62839'], ['Tangerine', '#f77f00'], ['Mustard', '#e9b72b'], ['Lime', '#9bc53d'],
                ['Emerald', '#1b9e5a'], ['Teal', '#0f8b8d'], ['Sky', '#4cc9f0'], ['Cobalt', '#2f5bea'],
                ['Navy', '#1d2b53'], ['Violet', '#7b3fe4'], ['Magenta', '#d6336c'], ['Blush', '#f4a6b8'],
                ['Snow', '#f5f3ee'], ['Sand', '#d8c3a5'], ['Stone', '#9ca3af'], ['Charcoal', '#2f343b'],
                ['Black', '#111214'], ['Chocolate', '#6b3f2a'], ['Olive', '#707a2f'], ['Burgundy', '#7a1f35']
            ];
            const RAIL_ANGLE = 27;
            const COS = Math.cos(RAIL_ANGLE * Math.PI / 180);
            const SIN = Math.sin(RAIL_ANGLE * Math.PI / 180);
            const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const PROTECTED = ['id', 'index', 'indexLabel'];

            const $ = s => document.querySelector(s);
            const pad2 = n => String(n).padStart(2, '0');
            const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            const smooth = () => (RM ? 'auto' : 'smooth');

            /* ---------- Garment silhouettes (SVG sprite) ---------- */
            const SHAPES = {
                tshirt: { d: ['M33 8 7 23l10 19 9-5v66h48V37l9 5 10-19L67 8Q50 25 33 8Z'], x: ['M33 8Q50 25 67 8'] },
                hoodie: { d: ['M32 16 8 30 4 88l15 3 5-36v52h52V55l5 36 15-3-4-58L68 16Q50 30 32 16Z', 'M33 15Q50-3 67 15Q50 38 33 15Z'], x: ['M32 84h36l-4 14H36Z', 'M46 30v14M54 30v14'] },
                jacket: { d: ['M32 14 8 30 4 88l15 3 5-36v52h52V55l5 36 15-3-4-58L68 14 50 26Z'], x: ['M50 26v80', 'M32 14l8 14 10-2M68 14l-8 14-10-2', 'M30 80h12M58 80h12'] },
                pants: { d: ['M27 8h46l8 98H55L50 44l-5 62H19Z'], x: ['M27 17h46', 'M50 17v27'] }
            };

            (function injectSprite() {
                const sym = Object.keys(SHAPES).map(k => {
                    const s = SHAPES[k];
                    return `<symbol id="g-${k}" viewBox="0 0 100 110">`
                        + s.d.map(d => `<path d="${d}" fill="currentColor"/><path d="${d}" fill="url(#gmShade)" stroke="rgba(0,0,0,.55)" stroke-width="1.6" stroke-linejoin="round"/>`).join('')
                        + s.x.map(d => `<path d="${d}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1.4" stroke-linecap="round"/>`).join('')
                        + `</symbol>`;
                }).join('');
                document.body.insertAdjacentHTML('afterbegin',
                    `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
                        <linearGradient id="gmShade" x1="0" x2="1">
                            <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
                            <stop offset=".5" stop-color="#000" stop-opacity="0"/>
                            <stop offset="1" stop-color="#000" stop-opacity=".3"/>
                        </linearGradient></defs>${sym}</svg>`);
            })();

            /* ---------- Data ---------- */
            const items = Array.from({ length: MAX_ITEMS }, (_, i) => {
                const index = i + 1;
                const indexLabel = pad2(index);
                const category = CATEGORIES[i % CATEGORIES.length];
                const titlePrefix = category === 'tshirt' ? 'Studio Tee'
                    : category === 'pants' ? 'Cargo Pant'
                    : category === 'hoodie' ? 'Heavy Hoodie'
                    : 'Shell Jacket';
                const col = COLORS[(i * 7) % COLORS.length];
                return {
                    id: `item-${indexLabel}`,
                    index, indexLabel, category,
                    name: `${titlePrefix} #${indexLabel}`,
                    price: 39 + (i % 8) * 4,
                    currency: '$',
                    quality: QUALITIES[i % QUALITIES.length],
                    sizes: 'S, M, L, XL',
                    color: col[0],
                    colorHex: col[1],
                    description: DESCRIPTIONS[category],
                    image: ''
                };
            });

            /* ---------- State ---------- */
            let activeCat = 'all';
            let selectedId = items[0].id;
            let pulledId = null;
            let cartCount = 0;
            let selectedSize = null;
            let list = [];
            let els = [];
            let vis = [];
            let nearFlags = [];
            let pos = 0, target = 0, raf = 0, lastT = 0;
            let drag = null, justDragged = false;
            let G = { tw: 200, A: 150, x0: 120, y0: 30, sx: 4, sy: 60 };

            const stage = $('#rackTrack');
            const plane = $('#rackPlane');
            const rail = $('#rackRail');
            const shelfA = $('#shelfA');
            const shelfB = $('#shelfB');

            const getFilteredItems = () => activeCat === 'all' ? items : items.filter(it => it.category === activeCat);
            const sizesList = it => (Array.isArray(it.sizes) ? it.sizes : String(it.sizes || '').split(',')).map(s => String(s).trim()).filter(Boolean);
            const shapeOf = it => SHAPES[it.category] ? it.category : 'tshirt';

            /* ---------- Geometry ---------- */
            function layout() {
                const W = stage.clientWidth, H = stage.clientHeight;
                if (!W || !H) return;
                const mob = W < 560;
                const tw = Math.min(W * (mob ? 0.42 : 0.27), H * 0.44);
                const x0 = tw * 0.55 + W * 0.02;
                const y0 = H * 0.075;
                const A = Math.max(30, Math.min(W * 0.2, H * 0.34, (W * 0.95 - x0) / 4.05));
                G = { tw, A, x0, y0, sx: tw * 0.02, sy: Math.min(tw * 0.3, H * 0.12) };
                plane.style.left = x0 + 'px';
                plane.style.top = y0 + 'px';
                stage.style.setProperty('--tw', tw + 'px');
                rail.style.left = (-A * 1.4) + 'px';
                rail.style.width = (A * 6.6) + 'px';
                draw();
            }

            /* Overlapping stack along the 27deg rail + pulled-out piece */
            function draw() {
                const { A, sx, sy } = G;
                const q = 0.78, inv = 1 / (1 - q);
                const px = sx * COS + sy * SIN;   // screen offset -> rail-plane coordinates
                const py = -sx * SIN + sy * COS;
                let pm = 0, pi = -1;
                for (let i = 0; i < els.length; i++) {
                    const p = els[i]._p || 0;
                    if (p > pm) { pm = p; pi = i; }
                }
                const push = pm * A * 0.42;
                const act = clamp(Math.round(pos), 0, list.length - 1);

                for (let i = 0; i < els.length; i++) {
                    const el = els[i], p = el._p || 0, d = i - pos;
                    if ((d < -1.4 || d > 14) && p < 0.01) {
                        if (vis[i] !== 0) { el.style.visibility = 'hidden'; vis[i] = 0; }
                        continue;
                    }
                    if (vis[i] !== 1) { el.style.visibility = 'visible'; vis[i] = 1; }

                    let dist = d >= 0 ? A * (1 - Math.pow(q, d)) * inv : A * 1.13 * d;
                    if (pi > -1 && i !== pi) dist += i > pi ? push : -push;
                    const s = Math.pow(0.9, Math.max(d, 0));
                    const o = p > 0.01 ? 1 : d < 0 ? Math.max(0, 1 + d / 1.4) : d > 10 ? Math.max(0, (14 - d) / 4) : 1;

                    el.style.transform =
                        `translate3d(${(dist + px * p).toFixed(1)}px,${(py * p).toFixed(1)}px,0) rotate(${(-RAIL_ANGLE + 2.5 * p).toFixed(2)}deg) scale(${(s * (1 + 0.3 * p)).toFixed(3)})`;
                    el.style.opacity = o.toFixed(2);
                    el.style.zIndex = String(p > 0.02 ? 2000 : 1000 - Math.round(d * 10));

                    const near = d < 6;
                    if (nearFlags[i] !== near) { el.classList.toggle('near', near); nearFlags[i] = near; }
                    const on = el._t === 1;
                    if (el._cls !== on) { el.classList.toggle('pulled', on); el._cls = on; }
                }

                if (list[act] && list[act].id !== selectedId) renderDetails(list[act]);
            }

            /* ---------- Motion engine (rail position + pull progress) ---------- */
            function tick(t) {
                const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
                lastT = t;
                let busy = false;
                const dpos = target - pos;
                if (Math.abs(dpos) < 0.0008) pos = target;
                else { pos += dpos * (1 - Math.exp(-dt * 8)); busy = true; }
                const k = 1 - Math.exp(-dt * 7);
                for (const el of els) {
                    const dp = (el._t || 0) - (el._p || 0);
                    if (Math.abs(dp) < 0.002) el._p = el._t || 0;
                    else { el._p = (el._p || 0) + dp * k; busy = true; }
                }
                draw();
                raf = busy ? requestAnimationFrame(tick) : 0;
            }

            function kick() {
                if (RM) {
                    els.forEach(el => { el._p = el._t || 0; });
                    pos = target; draw(); return;
                }
                if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
            }

            function moveTo(v, instant) {
                target = clamp(v, 0, Math.max(0, list.length - 1));
                if (instant) { pos = target; draw(); }
                kick();
            }

            const currentIndex = () => Math.max(0, list.findIndex(x => x.id === selectedId));

            function select(i) {
                if (!list.length) return;
                i = clamp(i, 0, list.length - 1);
                renderDetails(list[i]);
                moveTo(i);
            }

            function stepBy(delta) {
                if (!list.length) return;
                select((currentIndex() + delta + list.length) % list.length);
            }

            /* Pull a piece out of the stack / put it back on the rail */
            function setPull(id, on) {
                els.forEach(el => { el._t = (on && el.dataset.id === id) ? 1 : 0; });
                pulledId = on ? id : null;
                kick();
            }
            function releasePull() { setPull(null, false); }

            /* ---------- Rendering ---------- */
            function svgGarment(it, cls) {
                return `<svg class="${cls}" viewBox="0 0 100 110" style="color:${esc(it.colorHex)}" aria-hidden="true"><use href="#g-${shapeOf(it)}"/></svg>`;
            }
            function garmentHTML(it, cls) {
                const img = it.image && String(it.image).trim();
                if (img) return `<img class="${cls}" src="${esc(img)}" alt="${esc(it.name)}" draggable="false" data-fb="${esc(it.id)}">`;
                return svgGarment(it, cls);
            }

            /* If an image URL fails, fall back to the drawn garment */
            document.addEventListener('error', e => {
                const t = e.target;
                if (t && t.tagName === 'IMG' && t.dataset && t.dataset.fb) {
                    const it = items.find(x => x.id === t.dataset.fb);
                    if (it) t.outerHTML = svgGarment(it, t.className);
                }
            }, true);

            function cardHTML(it, i) {
                return `<button type="button" class="rack-hanger-card" role="option" data-id="${esc(it.id)}" data-i="${i}" tabindex="-1"
                            aria-label="${esc(it.name)}, ${esc(it.color)}, ${esc(it.currency)}${esc(it.price)}">
                        <span class="rk-tag">#${esc(it.indexLabel)}</span>
                        <svg class="rk-hook" viewBox="0 0 24 30" aria-hidden="true">
                            <path d="M12 29V17c0-4 5-5 5-9a5 5 0 1 0-10 0" fill="none" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                        ${garmentHTML(it, 'gm')}
                    </button>`;
            }

            function miniHTML(it) {
                return `<article class="mini" role="listitem" tabindex="0" data-id="${esc(it.id)}" aria-label="${esc(it.name)}">
                        <span class="mini-idx">#${esc(it.indexLabel)}</span>
                        <div class="mini-img">${garmentHTML(it, 'gm')}</div>
                        <span class="mini-name">${esc(it.name)}</span>
                        <div class="mini-row">
                            <span class="mini-price">${esc(it.currency)}${esc(it.price)}</span>
                            <button type="button" class="mini-add" data-add-id="${esc(it.id)}" aria-label="Add ${esc(it.name)} to cart">+</button>
                        </div>
                    </article>`;
            }

            function renderShelves(animate) {
                const a = [], b = [];
                list.forEach((it, i) => (i % 2 ? b : a).push(miniHTML(it)));
                const empty = '<div class="empty-shelf">No items</div>';
                shelfA.innerHTML = a.join('') || empty;
                shelfB.innerHTML = b.join('') || empty;
                $('#catCount').textContent = `${list.length} ITEMS`;
                shelfA.scrollLeft = 0; shelfB.scrollLeft = 0;
                const cur = list.find(x => x.id === selectedId);
                if (cur) document.querySelectorAll('.mini').forEach(m => m.classList.toggle('active', m.dataset.id === cur.id));
                if (animate && !RM) {
                    Array.from(document.querySelectorAll('.mini')).slice(0, 12).forEach((m, i) => {
                        m.animate([{ opacity: 0, transform: 'translateY(18px)' }, { opacity: 1, transform: 'none' }],
                            { duration: 450, delay: i * 35, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
                    });
                }
            }

            function renderDetails(item) {
                if (!item) return;
                const changed = item.id !== selectedId;
                selectedId = item.id;
                if (changed) { selectedSize = null; if (pulledId && pulledId !== item.id) releasePull(); }

                $('#detailTitle').textContent = item.name;
                $('#detailMeta').textContent = `NO. ${item.indexLabel} • ${String(item.category).toUpperCase()}`;
                $('#detailDesc').textContent = item.description || '';
                $('#detailMaterial').textContent = item.quality || '';
                $('#detailColor').innerHTML = `<span class="color-dot" style="background:${esc(item.colorHex)}"></span>${esc(item.color)}`;
                $('#detailPrice').textContent = `${item.currency}${item.price}`;
                document.querySelectorAll('[data-counter]').forEach(n => { n.textContent = `${item.indexLabel} / ${pad2(items.length)}`; });

                $('#detailSizes').innerHTML = sizesList(item)
                    .map(s => `<button type="button" class="size-chip" data-size="${esc(s)}" aria-pressed="${s === selectedSize}">${esc(s)}</button>`).join('');

                els.forEach((el, i) => {
                    const on = list[i] && list[i].id === item.id;
                    el.classList.toggle('active', on);
                    el.setAttribute('aria-selected', on);
                    el.tabIndex = on ? 0 : -1;
                });

                document.querySelectorAll('.mini').forEach(m => {
                    const on = m.dataset.id === item.id;
                    m.classList.toggle('active', on);
                    if (on && changed && !drag) {
                        const sh = m.parentElement;
                        sh.scrollTo({ left: m.offsetLeft - (sh.clientWidth - m.offsetWidth) / 2, behavior: smooth() });
                    }
                });
            }

            /* flourishDelay: undefined = no intro motion; number = ms before the stack slides into place */
            function renderRack(flourishDelay) {
                list = getFilteredItems();
                if (!list.some(x => x.id === selectedId) && list.length) selectedId = list[0].id;
                if (pulledId && !list.some(x => x.id === pulledId)) pulledId = null;

                els.forEach(e => e.remove());
                plane.insertAdjacentHTML('beforeend', list.map(cardHTML).join(''));
                els = Array.from(plane.querySelectorAll('.rack-hanger-card'));
                els.forEach(el => { el._p = el._t = (el.dataset.id === pulledId) ? 1 : 0; el._cls = undefined; });
                vis = []; nearFlags = [];

                const idx = currentIndex();
                if (raf) { cancelAnimationFrame(raf); raf = 0; }
                pos = target = idx;
                layout();
                renderDetails(list[idx]);
                renderShelves(flourishDelay !== undefined);

                if (flourishDelay !== undefined && !RM && list.length > 1) {
                    pos = Math.min(list.length - 1, idx + 4);
                    draw();
                    setTimeout(() => moveTo(idx), flourishDelay);
                }
            }

            /* ---------- Cart ---------- */
            function addToCart(item) {
                if (!item) return;
                cartCount += 1;
                $('#cartQty').textContent = String(cartCount);
                releasePull(); // piece glides back to its place on the 27deg rail
                const btn = $('#addTeeBtn');
                if (!RM && btn.animate) btn.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.06)' }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' });
                try {
                    window.parent && window.parent !== window && window.parent.postMessage(
                        { source: 'ShopTshirtApp', type: 'CART_ADD', id: item.id, size: selectedSize, count: cartCount }, '*');
                } catch (_) { /* ignore */ }
            }

            /* ---------- Input: drag along the 27deg axis ---------- */
            stage.addEventListener('pointerdown', e => {
                if (e.button > 0) return;
                if (raf) { cancelAnimationFrame(raf); raf = 0; }
                target = pos;
                drag = { x: e.clientX, y: e.clientY, p: pos, moved: false, lx: e.clientX, ly: e.clientY, lt: performance.now(), v: 0 };
            });

            stage.addEventListener('pointermove', e => {
                if (!drag) return;
                const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                const proj = dx * COS + dy * SIN;
                if (!drag.moved && Math.abs(proj) > 6) {
                    drag.moved = true;
                    stage.setPointerCapture(e.pointerId);
                    stage.classList.add('dragging');
                }
                if (!drag.moved) return;
                const unit = G.A * 0.55, now = performance.now();
                const dp = ((e.clientX - drag.lx) * COS + (e.clientY - drag.ly) * SIN) / unit;
                drag.v = -dp / Math.max(1, now - drag.lt);
                drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
                pos = clamp(drag.p - proj / unit, -0.3, list.length - 0.7);
                target = pos;
                draw();
            });

            function endDrag() {
                if (!drag) return;
                const was = drag.moved, v = drag.v;
                drag = null;
                stage.classList.remove('dragging');
                if (was) {
                    justDragged = true;
                    setTimeout(() => { justDragged = false; }, 60);
                    select(Math.round(clamp(pos + v * 180, 0, list.length - 1)));
                }
            }
            stage.addEventListener('pointerup', endDrag);
            stage.addEventListener('pointercancel', endDrag);

            let wheelT = 0;
            stage.addEventListener('wheel', e => {
                const dlt = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                if (Math.abs(dlt) < 4) return;
                const next = currentIndex() + (dlt > 0 ? 1 : -1);
                if (next < 0 || next >= list.length) return; // let the page scroll at the ends
                e.preventDefault();
                const now = performance.now();
                if (now - wheelT < 130) return;
                wheelT = now;
                select(next);
            }, { passive: false });

            document.addEventListener('keydown', e => {
                const tag = (document.activeElement && document.activeElement.tagName) || '';
                if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
                if (e.key === 'ArrowRight') { e.preventDefault(); stepBy(1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBy(-1); }
                else if (e.key === 'Escape') releasePull();
                else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.classList.contains('mini')) {
                    e.preventDefault(); chooseFromShelf(document.activeElement.dataset.id);
                }
            });

            /* ---------- Clicks ---------- */
            function setCategory(cat) {
                activeCat = cat || 'all';
                document.querySelectorAll('[data-cat]').forEach(b => b.classList.toggle('active', b.dataset.cat === activeCat));
                renderRack(0);
            }

            function chooseFromShelf(id) {
                const i = list.findIndex(x => x.id === id);
                if (i < 0) return;
                select(i);
                $('#hero').scrollIntoView({ behavior: smooth(), block: 'start' });
            }

            document.addEventListener('click', e => {
                const catBtn = e.target.closest('.side-cat-btn, .cat-tab');
                if (catBtn) { setCategory(catBtn.dataset.cat); return; }

                const add = e.target.closest('[data-add-id]');
                if (add) { addToCart(items.find(x => x.id === add.dataset.addId)); return; }

                const mini = e.target.closest('.mini');
                if (mini) { chooseFromShelf(mini.dataset.id); return; }

                const card = e.target.closest('.rack-hanger-card');
                if (card) {
                    if (justDragged) return;
                    const id = card.dataset.id;
                    const i = list.findIndex(x => x.id === id);
                    if (i < 0) return;
                    if (pulledId === id) { releasePull(); return; }   // click again = put back
                    select(i);
                    setPull(id, true);                                // pull out of the stack
                    return;
                }

                const chip = e.target.closest('.size-chip');
                if (chip) {
                    selectedSize = chip.dataset.size;
                    document.querySelectorAll('.size-chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
                    return;
                }

                if (e.target.closest('#prevTeeBtn')) { stepBy(-1); return; }
                if (e.target.closest('#nextTeeBtn')) { stepBy(1); return; }
                if (e.target.closest('#addTeeBtn')) { addToCart(items.find(x => x.id === selectedId)); return; }
                if (e.target.closest('#imgReplaceBtn')) { $('#imgInput').click(); return; }
                if (e.target.closest('#imgClearBtn')) { applyChanges(items.find(x => x.id === selectedId), { image: '' }); }
            });

            /* ---------- Editing: image upload + generic updates ---------- */
            function applyChanges(item, changes) {
                if (!item || !changes || typeof changes !== 'object') return null;
                Object.keys(changes).forEach(k => {
                    if (PROTECTED.indexOf(k) > -1) return;
                    let v = changes[k];
                    if (k === 'price') { const n = Number(v); if (!isFinite(n)) return; v = n; }
                    else if (k === 'image') v = v == null ? '' : String(v).trim();
                    else if (k === 'category') v = String(v || '').toLowerCase();
                    else if (k === 'sizes' && Array.isArray(v)) v = v.map(String).join(', ');
                    item[k] = v;
                });
                renderRack();
                return item;
            }

            $('#imgInput').addEventListener('change', e => {
                const file = e.target.files && e.target.files[0];
                const item = items.find(x => x.id === selectedId);
                if (!file || !item) return;
                const fr = new FileReader();
                fr.onload = () => {
                    applyChanges(item, { image: String(fr.result) });
                    try {
                        window.parent && window.parent !== window && window.parent.postMessage(
                            { source: 'ShopTshirtApp', type: 'PRODUCT_IMAGE_CHANGED', id: item.id, image: item.image }, '*');
                    } catch (_) { /* ignore */ }
                };
                fr.readAsDataURL(file);
                e.target.value = '';
            });

            if (/[?&]edit(=1|=true|&|$)/.test(location.search)) document.body.classList.add('edit-mode');

            /* ---------- postMessage bridge ---------- */
            window.addEventListener('message', event => {
                const msg = event.data;
                if (!msg || typeof msg !== 'object') return;
                try {
                    if (msg.type === 'SET_EDIT_MODE') { document.body.classList.toggle('edit-mode', !!msg.value); return; }
                    const t = items.find(x => x.id === msg.productId || x.id === msg.id || x.index === Number(msg.index));
                    if (!t) return;
                    if (msg.type === 'SET_PRODUCT_FIELD' && msg.field) applyChanges(t, { [msg.field]: msg.value });
                    else if (msg.type === 'SET_PRODUCT' && msg.changes) applyChanges(t, msg.changes);
                    else if (msg.type === 'SET_PRODUCT_IMAGE') applyChanges(t, { image: msg.value || msg.image || '' });
                    else if (msg.type === 'SELECT_PRODUCT') window.ShopTshirtApp.select(t.id);
                } catch (err) { console.warn('ShopTshirtApp message error', err); }
            });

            /* ---------- Public API ---------- */
            window.ShopTshirtApp = {
                items,
                updateItem(id, changes) {
                    const found = items.find(x => x.id === id);
                    return found ? applyChanges(found, changes) : null;
                },
                select(id) {
                    const i = list.findIndex(x => x.id === id);
                    if (i > -1) select(i);
                },
                getCartCount() { return cartCount; },
                pull(id) { const i = list.findIndex(x => x.id === id); if (i > -1) { select(i); setPull(id, true); } },
                releasePull,
                addToCart(id) { addToCart(items.find(x => x.id === (id || selectedId))); }
            };

            if ('ResizeObserver' in window) new ResizeObserver(layout).observe(stage);
            else window.addEventListener('resize', layout);

            /* ---------- Entrance choreography (WAAPI, transform/opacity first) ---------- */
            function intro() {
                const ease = 'cubic-bezier(.2,.8,.2,1)';
                const anim = (el, kf, o) => el && el.animate && el.animate(kf, Object.assign({ duration: 800, easing: ease, fill: 'both' }, o));

                document.querySelectorAll('.wire-wave').forEach((w, i) =>
                    anim(w, [{ opacity: 0, scale: '.55' }, { opacity: 1, scale: '1' }], { duration: 1500, delay: i * 70 }));

                anim($('#logo'), [{ opacity: 0, transform: 'translateY(-18px) scale(.9)' }, { opacity: 1, transform: 'none' }], { duration: 700, delay: 150 });
                document.querySelectorAll('.logo-draw').forEach((p, i) =>
                    anim(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 1300, delay: 250 + i * 160, easing: 'ease-in-out' }));
                anim($('#logoText'), [{ opacity: 0, letterSpacing: '.7em' }, { opacity: 1, letterSpacing: '.3em' }], { duration: 1100, delay: 500 });

                anim($('#siteTitle'), [
                    { opacity: 0, clipPath: 'inset(0 100% 0 0)', letterSpacing: '.5em', filter: 'blur(14px)', transform: 'translateY(22px)' },
                    { opacity: 1, clipPath: 'inset(0 0% 0 0)', letterSpacing: '.14em', filter: 'blur(0px)', transform: 'none' }
                ], { duration: 1300, delay: 600 });
                anim($('#titleBar'), [{ transform: 'scaleX(0)', opacity: 0 }, { transform: 'scaleX(1)', opacity: 1 }], { duration: 900, delay: 1100 });

                anim($('#rackTrack'), [{ opacity: 0, transform: 'translateX(-40px)' }, { opacity: 1, transform: 'none' }], { duration: 1000, delay: 800 });
                anim($('#rackRail'), [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 1200, delay: 850 });
                anim($('#teeDetailsBar'), [{ opacity: 0, transform: 'translateX(60px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: 1100 });
                Array.from($('#teeDetailsBar').children).forEach((c, i) =>
                    anim(c, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 1250 + i * 60 }));
                document.querySelectorAll('.side-cat-btn').forEach((b, i) =>
                    anim(b, [{ opacity: 0, transform: 'translateX(-24px)' }, { opacity: 1, transform: 'none' }], { duration: 600, delay: 900 + i * 80 }));

                const cat = $('#catalog');
                const reveal = () => {
                    anim($('#catBar'), [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 600 });
                    Array.from(document.querySelectorAll('.mini')).slice(0, 12).forEach((m, i) =>
                        m.animate([{ opacity: 0, transform: 'translateY(22px)' }, { opacity: 1, transform: 'none' }],
                            { duration: 550, delay: 120 + i * 40, easing: ease, fill: 'backwards' }));
                };
                if ('IntersectionObserver' in window) {
                    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { reveal(); io.disconnect(); } }, { threshold: 0.15 });
                    io.observe(cat);
                } else reveal();
            }

            renderRack(RM ? undefined : 950);
            if (!RM) intro();
        })();
    </script>
</body>

</html>
