<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop T-Shirt - Interactive Monitor Rack" data-editable="meta_description" data-editable-type="text">
    <meta name="theme-color" content="#123d25" data-editable="theme_color" data-editable-type="color">
    <title data-editable="page_title" data-editable-type="text">Shop T-Shirt</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            position: relative;
            background:
                linear-gradient(180deg, rgba(8, 12, 10, 0.52) 0%, rgba(8, 12, 10, 0.22) 50%, rgba(6, 10, 8, 0.62) 100%),
                linear-gradient(135deg, #4ade80 0%, #166534 45%, #062814 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px 18px 40px;
            overflow-x: hidden;
        }

        /* الأسلاك المتموجة في الخلفية */
        .site-wires-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .wire-wave {
            position: absolute;
            width: 820px;
            height: 280px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(163, 230, 53, 0.52);
            filter: drop-shadow(0 0 10px rgba(163, 230, 53, 0.24));
            animation: wireFloat 4.6s ease-in-out infinite;
        }

        @keyframes wireFloat {
            0%, 100% { translate: 0px 0px; }
            50% { translate: 10px -12px; }
        }

        .w-1  { top: -6%;  left: 24%; transform: rotate(-42deg); border-top-color: rgba(217, 249, 157, 0.55); animation-delay: 0s; }
        .w-2  { top: -3%;  left: 27%; transform: rotate(-39deg); border-top-color: rgba(163, 230, 53, 0.55);  animation-delay: 0.25s; }
        .w-3  { top: 0%;   left: 30%; transform: rotate(-36deg); border-top-color: rgba(74, 222, 128, 0.5);   animation-delay: 0.5s; }
        .w-4  { top: 3%;   left: 33%; transform: rotate(-33deg); border-top-color: rgba(217, 249, 157, 0.45); animation-delay: 0.75s; }
        .w-5  { top: 6%;   left: 36%; transform: rotate(-30deg); border-top-color: rgba(163, 230, 53, 0.45);  animation-delay: 1s; }
        .w-6  { top: 9%;   left: 39%; transform: rotate(-27deg); border-top-color: rgba(74, 222, 128, 0.4);   animation-delay: 1.25s; }
        .w-7  { top: 12%;  left: 42%; transform: rotate(-24deg); border-top-color: rgba(217, 249, 157, 0.35); animation-delay: 1.5s; }
        .w-8  { top: 15%;  left: 45%; transform: rotate(-21deg); border-top-color: rgba(163, 230, 53, 0.35);  animation-delay: 1.75s; }

        .w-9  { bottom: 20%; left: 26%; transform: rotate(22deg); border-bottom-color: rgba(163, 230, 53, 0.45); border-top-color: transparent; animation-delay: 0.2s; }
        .w-10 { bottom: 16%; left: 29%; transform: rotate(25deg); border-bottom-color: rgba(217, 249, 157, 0.5);  border-top-color: transparent; animation-delay: 0.45s; }
        .w-11 { bottom: 12%; left: 32%; transform: rotate(28deg); border-bottom-color: rgba(74, 222, 128, 0.5);   border-top-color: transparent; animation-delay: 0.7s; }
        .w-12 { bottom: 8%;  left: 35%; transform: rotate(31deg); border-bottom-color: rgba(163, 230, 53, 0.55); border-top-color: transparent; animation-delay: 0.95s; }
        .w-13 { bottom: 4%;  left: 38%; transform: rotate(34deg); border-bottom-color: rgba(217, 249, 157, 0.55); border-top-color: transparent; animation-delay: 1.2s; }
        .w-14 { bottom: 0%;  left: 41%; transform: rotate(37deg); border-bottom-color: rgba(74, 222, 128, 0.5);   border-top-color: transparent; animation-delay: 1.45s; }
        .w-15 { bottom: -4%; left: 44%; transform: rotate(40deg); border-bottom-color: rgba(163, 230, 53, 0.45); border-top-color: transparent; animation-delay: 1.7s; }
        .w-16 { bottom: -8%; left: 47%; transform: rotate(43deg); border-bottom-color: rgba(217, 249, 157, 0.4);  border-top-color: transparent; animation-delay: 1.95s; }

        .site-stage {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .site-top-title {
            font-size: clamp(1.7rem, 3vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 0.14em;
            color: #f0fdf4;
            text-align: center;
        }

        .monitor-layout {
            width: 100%;
            display: grid;
            grid-template-columns: 145px minmax(0, 1fr);
            gap: 22px;
            align-items: center;
        }

        /* أصناف الملابس على اليسار كتابة فقط بلا خلفية */
        .side-categories-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
        }

        .side-cat-btn {
            background: transparent;
            border: none;
            padding: 4px 0;
            color: #f8fafc;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            cursor: pointer;
            text-align: left;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .side-cat-btn:hover,
        .side-cat-btn.active {
            color: #86efac;
            transform: translateX(6px) scale(1.06);
        }

        /* شاشة التلفاز / الحاسوب الكبيرة */
        .monitor-device {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .monitor-bezel {
            width: 100%;
            aspect-ratio: 21 / 9.8;
            min-height: 510px;
            background: #14171f;
            border: 12px solid #1f2430;
            border-radius: 14px;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            position: relative;
        }

        .monitor-screen {
            position: relative;
            width: 100%;
            height: 100%;
            background: #eceae5;
            color: #0f172a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 14px 18px;
        }

        /* العمود المائل واصل حتى للسقف العلوي للشاشة */
        .angled-rack-rail {
            position: absolute;
            top: 0;
            left: 16%;
            width: 62%;
            height: 5px;
            border-radius: 999px;
            background: #1e293b;
            transform: rotate(27deg);
            transform-origin: left top;
            z-index: 2;
        }

        /* شريط التحكم العلوي داخل الشاشة */
        .screen-top-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            font-weight: 800;
            color: #1e293b;
        }

        .screen-pill {
            background: #0f172a;
            color: #86efac;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        /* مسار السكة: التيشيرتات متراكبة وتتبع ميلان الخط الأحمر من اليسار لليمين */
        .rack-track-wrap {
            position: relative;
            z-index: 5;
            width: 100%;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 34px 18px 20px;
            display: flex;
            align-items: flex-start;
            scrollbar-width: thin;
        }

        .rack-hanger-card {
            position: relative;
            flex: 0 0 124px;
            margin-right: -52px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 7px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 3px;
            /* يتبع زاوية ميلان الخط وينزل تدريجياً معه */
            transform: translateY(var(--rail-y, 0px)) rotate(24deg);
            transform-origin: top left;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
        }

        .rack-hanger-card:hover {
            transform: translateY(calc(var(--rail-y, 0px) - 5px)) rotate(20deg);
            z-index: 60 !important;
        }

        .rack-hanger-card.active {
            border-color: #16a34a;
            box-shadow: 0 14px 26px rgba(22, 163, 74, 0.35);
            transform: translateY(calc(var(--rail-y, 0px) - 7px)) rotate(14deg) scale(1.05);
            z-index: 70 !important;
        }

        .rack-idx {
            font-size: 0.66rem;
            font-weight: 900;
            color: #15803d;
        }

        .rack-thumb {
            width: 100%;
            height: 70px;
            object-fit: contain;
            background: #f8fafc;
            border-radius: 8px;
        }

        .rack-name {
            font-size: 0.72rem;
            font-weight: 800;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rack-price {
            font-size: 0.74rem;
            font-weight: 900;
            color: #15803d;
        }

        /* تفاصيل القطعة المختارة أسفل الشاشة */
        .screen-bottom-details {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: #0f172a;
        }

        .detail-main strong {
            font-size: 0.95rem;
            display: block;
        }

        .detail-main span {
            font-size: 0.78rem;
            color: #475569;
        }

        .detail-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .detail-price-tag {
            font-size: 1rem;
            font-weight: 900;
            color: #15803d;
        }

        .screen-btn {
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
        }

        .screen-btn.green {
            background: #16a34a;
        }

        .monitor-stand {
            width: 120px;
            height: 64px;
            background: linear-gradient(180deg, #252a37, #171a22);
        }

        .monitor-base {
            width: 270px;
            height: 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, #2b3140, #191d26);
        }

        @media (max-width: 900px) {
            .monitor-layout {
                grid-template-columns: 1fr;
            }

            .side-categories-column {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 16px;
            }

            .monitor-bezel {
                aspect-ratio: 16 / 10;
                min-height: 360px;
            }
        }
    </style>
</head>

<body data-template="shop-tshirt" data-template-version="1.0.0">

    <div class="site-wires-bg" aria-hidden="true">
        <span class="wire-wave w-1"></span>
        <span class="wire-wave w-2"></span>
        <span class="wire-wave w-3"></span>
        <span class="wire-wave w-4"></span>
        <span class="wire-wave w-5"></span>
        <span class="wire-wave w-6"></span>
        <span class="wire-wave w-7"></span>
        <span class="wire-wave w-8"></span>
        <span class="wire-wave w-9"></span>
        <span class="wire-wave w-10"></span>
        <span class="wire-wave w-11"></span>
        <span class="wire-wave w-12"></span>
        <span class="wire-wave w-13"></span>
        <span class="wire-wave w-14"></span>
        <span class="wire-wave w-15"></span>
        <span class="wire-wave w-16"></span>
    </div>

    <main class="site-stage">
        <h1 class="site-top-title" data-editable="site_title" data-editable-type="text">
            SHOP T-SHIRT
        </h1>

        <div class="monitor-layout">
            <!-- الأصناف على اليسار كتابة فقط -->
            <aside class="side-categories-column" aria-label="Categories">
                <button type="button" class="side-cat-btn active" data-cat="all">All Items</button>
                <button type="button" class="side-cat-btn" data-cat="tshirt">T-Shirt</button>
                <button type="button" class="side-cat-btn" data-cat="pants">Pants</button>
                <button type="button" class="side-cat-btn" data-cat="hoodie">Hoodie</button>
                <button type="button" class="side-cat-btn" data-cat="jacket">Jacket</button>
            </aside>

            <!-- شاشة الحاسوب / التلفاز الكبيرة -->
            <div class="monitor-device">
                <div class="monitor-bezel">
                    <div class="monitor-screen" id="monitorScreen">
                        <div class="angled-rack-rail" aria-hidden="true"></div>

                        <div class="screen-top-bar">
                            <span>HANGING RACK (01 - 40)</span>
                            <div style="display:flex;gap:6px;align-items:center;">
                                <button type="button" class="screen-btn" id="prevTeeBtn">←</button>
                                <span class="screen-pill" id="rackCounter">01 / 40</span>
                                <button type="button" class="screen-btn" id="nextTeeBtn">→</button>
                            </div>
                        </div>

                        <div class="rack-track-wrap" id="rackTrack"></div>

                        <div class="screen-bottom-details" id="teeDetailsBar">
                            <div class="detail-main">
                                <strong id="detailTitle">Studio Tee #01</strong>
                                <span id="detailMeta">Index #01 • 320 GSM Combed Cotton • S, M, L, XL</span>
                            </div>
                            <div class="detail-right">
                                <span class="detail-price-tag" id="detailPrice">$39</span>
                                <button type="button" class="screen-btn green" id="addTeeBtn">Add to Cart (<span id="cartQty">0</span>)</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="monitor-stand" aria-hidden="true"></div>
                <div class="monitor-base" aria-hidden="true"></div>
            </div>
        </div>
    </main>

    <script>
        (() => {
            const MAX_ITEMS = 40;
            const CATEGORIES = ['tshirt', 'pants', 'hoodie', 'jacket'];
            const QUALITIES = [
                '320 GSM Combed Cotton',
                '340 GSM Heavy Jersey',
                '290 GSM Ring-Spun Cotton',
                '310 GSM Boxy Weave'
            ];

            function pad2(n) {
                return String(n).padStart(2, '0');
            }

            function svgThumb(label, cat) {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
                    <rect width="240" height="200" rx="12" fill="#f1f5f9"/>
                    <path d="M72 48 L98 30 L142 30 L168 48 L196 72 L180 98 L160 84 L160 162 L80 162 L80 84 L60 98 L44 72 Z"
                          fill="#1e293b" stroke="#16a34a" stroke-width="4"/>
                    <text x="120" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">#${label}</text>
                    <text x="120" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#334155">${cat.toUpperCase()}</text>
                </svg>`;
                return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
            }

            const items = Array.from({ length: MAX_ITEMS }, (_, i) => {
                const index = i + 1;
                const indexLabel = pad2(index);
                const category = CATEGORIES[i % CATEGORIES.length];
                const quality = QUALITIES[i % QUALITIES.length];
                const titlePrefix = category === 'tshirt' ? 'Studio Tee'
                    : category === 'pants' ? 'Cargo Pant'
                    : category === 'hoodie' ? 'Heavy Hoodie'
                    : 'Shell Jacket';

                return {
                    id: `item-${indexLabel}`,
                    index,
                    indexLabel,
                    category,
                    name: `${titlePrefix} #${indexLabel}`,
                    price: 39 + (i % 8) * 4,
                    currency: '$',
                    quality,
                    sizes: 'S, M, L, XL',
                    image: ''
                };
            });

            let activeCat = 'all';
            let selectedId = items[0].id;
            let cartCount = 0;

            function getThumb(item) {
                return item.image && item.image.trim() ? item.image.trim() : svgThumb(item.indexLabel, item.category);
            }

            function getFilteredItems() {
                return activeCat === 'all' ? items : items.filter(it => it.category === activeCat);
            }

            function renderDetails(item) {
                if (!item) return;
                selectedId = item.id;
                document.getElementById('detailTitle').textContent = item.name;
                document.getElementById('detailMeta').textContent =
                    `Index #${item.indexLabel} • ${item.quality} • ${item.sizes}`;
                document.getElementById('detailPrice').textContent = `${item.currency}${item.price}`;
                document.getElementById('rackCounter').textContent = `${item.indexLabel} / ${pad2(items.length)}`;

                document.querySelectorAll('.rack-hanger-card').forEach(el => {
                    el.classList.toggle('active', el.dataset.id === item.id);
                });
            }

            function renderRack() {
                const list = getFilteredItems();
                const track = document.getElementById('rackTrack');

                if (!list.some(x => x.id === selectedId) && list.length) {
                    selectedId = list[0].id;
                }

                track.innerHTML = list.map((it, idx) => {
                    // يتبع نزول الخط المائل من اليسار لليمين
                    const railY = Math.min(96, idx * 6.5);
                    const z = list.length - idx;
                    const isAct = it.id === selectedId;
                    return `
                        <button
                            type="button"
                            class="rack-hanger-card ${isAct ? 'active' : ''}"
                            style="--rail-y:${railY}px; z-index:${isAct ? 70 : z};"
                            data-id="${it.id}"
                        >
                            <span class="rack-idx">#${it.indexLabel}</span>
                            <img class="rack-thumb" src="${getThumb(it)}" alt="${it.name}">
                            <span class="rack-name">${it.name}</span>
                            <span class="rack-price">${it.currency}${it.price}</span>
                        </button>
                    `;
                }).join('');

                const current = items.find(x => x.id === selectedId) || list[0];
                if (current) renderDetails(current);
            }

            // تحريك السكة مع السكرول
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    const track = document.getElementById('rackTrack');
                    const list = getFilteredItems();
                    if (track && list.length) {
                        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                        const progress = Math.min(1, Math.max(0, window.scrollY / maxScroll));
                        track.scrollLeft = progress * Math.max(0, track.scrollWidth - track.clientWidth);

                        const pos = Math.min(list.length - 1, Math.max(0, Math.round(progress * (list.length - 1))));
                        renderDetails(list[pos]);
                    }
                    ticking = false;
                });
            }, { passive: true });

            document.addEventListener('click', e => {
                const catBtn = e.target.closest('.side-cat-btn');
                if (catBtn) {
                    activeCat = catBtn.dataset.cat || 'all';
                    document.querySelectorAll('.side-cat-btn').forEach(b => b.classList.toggle('active', b === catBtn));
                    renderRack();
                    return;
                }

                const card = e.target.closest('.rack-hanger-card');
                if (card) {
                    const found = items.find(x => x.id === card.dataset.id);
                    if (found) renderDetails(found);
                    return;
                }

                if (e.target.closest('#prevTeeBtn')) {
                    const list = getFilteredItems();
                    const i = list.findIndex(x => x.id === selectedId);
                    if (list.length) renderDetails(list[(i - 1 + list.length) % list.length]);
                }

                if (e.target.closest('#nextTeeBtn')) {
                    const list = getFilteredItems();
                    const i = list.findIndex(x => x.id === selectedId);
                    if (list.length) renderDetails(list[(i + 1) % list.length]);
                }

                if (e.target.closest('#addTeeBtn')) {
                    cartCount += 1;
                    document.getElementById('cartQty').textContent = String(cartCount);
                }
            });

            // ربط صفحة edit عبر postMessage
            window.addEventListener('message', event => {
                const msg = event.data;
                if (!msg || typeof msg !== 'object') return;
                const target = items.find(x => x.id === msg.productId || x.id === msg.id || x.index === Number(msg.index));
                if (!target) return;

                if (msg.type === 'SET_PRODUCT_FIELD' && msg.field) {
                    target[msg.field] = msg.value;
                    renderRack();
                } else if (msg.type === 'SET_PRODUCT' && msg.changes) {
                    Object.assign(target, msg.changes);
                    renderRack();
                }
            });

            window.ShopTshirtApp = {
                items,
                updateItem(id, changes) {
                    const found = items.find(x => x.id === id);
                    if (!found) return null;
                    Object.assign(found, changes);
                    renderRack();
                    return found;
                }
            };

            renderRack();
        })();
    </script>
</body>

</html>
