<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Shop T-Shirt - Interactive Monitor Rack" data-editable="meta_description" data-editable-type="text">
    <meta name="theme-color" content="#123d25" data-editable="theme_color" data-editable-type="color">
    <title data-editable="page_title" data-editable-type="text">Shop T-Shirt</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            position: relative;
            background:
                linear-gradient(180deg, rgba(8, 12, 10, 0.52) 0%, rgba(8, 12, 10, 0.22) 50%, rgba(6, 10, 8, 0.62) 100%),
                linear-gradient(135deg, #4ade80 0%, #166534 45%, #062814 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 20px 18px 40px;
            overflow-x: hidden;
        }

        /* ---------- Background wires (unchanged) ---------- */
        .site-wires-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .wire-wave {
            position: absolute;
            width: 820px;
            height: 280px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(163, 230, 53, 0.52);
            filter: drop-shadow(0 0 10px rgba(163, 230, 53, 0.24));
            animation: wireFloat 4.6s ease-in-out infinite;
        }

        @keyframes wireFloat {
            0%, 100% { translate: 0px 0px; }
            50% { translate: 10px -12px; }
        }

        .w-1  { top: -6%;  left: 24%; transform: rotate(-42deg); border-top-color: rgba(217, 249, 157, 0.55); animation-delay: 0s; }
        .w-2  { top: -3%;  left: 27%; transform: rotate(-39deg); border-top-color: rgba(163, 230, 53, 0.55);  animation-delay: 0.25s; }
        .w-3  { top: 0%;   left: 30%; transform: rotate(-36deg); border-top-color: rgba(74, 222, 128, 0.5);   animation-delay: 0.5s; }
        .w-4  { top: 3%;   left: 33%; transform: rotate(-33deg); border-top-color: rgba(217, 249, 157, 0.45); animation-delay: 0.75s; }
        .w-5  { top: 6%;   left: 36%; transform: rotate(-30deg); border-top-color: rgba(163, 230, 53, 0.45);  animation-delay: 1s; }
        .w-6  { top: 9%;   left: 39%; transform: rotate(-27deg); border-top-color: rgba(74, 222, 128, 0.4);   animation-delay: 1.25s; }
        .w-7  { top: 12%;  left: 42%; transform: rotate(-24deg); border-top-color: rgba(217, 249, 157, 0.35); animation-delay: 1.5s; }
        .w-8  { top: 15%;  left: 45%; transform: rotate(-21deg); border-top-color: rgba(163, 230, 53, 0.35);  animation-delay: 1.75s; }

        .w-9  { bottom: 20%; left: 26%; transform: rotate(22deg); border-bottom-color: rgba(163, 230, 53, 0.45); border-top-color: transparent; animation-delay: 0.2s; }
        .w-10 { bottom: 16%; left: 29%; transform: rotate(25deg); border-bottom-color: rgba(217, 249, 157, 0.5);  border-top-color: transparent; animation-delay: 0.45s; }
        .w-11 { bottom: 12%; left: 32%; transform: rotate(28deg); border-bottom-color: rgba(74, 222, 128, 0.5);   border-top-color: transparent; animation-delay: 0.7s; }
        .w-12 { bottom: 8%;  left: 35%; transform: rotate(31deg); border-bottom-color: rgba(163, 230, 53, 0.55); border-top-color: transparent; animation-delay: 0.95s; }
        .w-13 { bottom: 4%;  left: 38%; transform: rotate(34deg); border-bottom-color: rgba(217, 249, 157, 0.55); border-top-color: transparent; animation-delay: 1.2s; }
        .w-14 { bottom: 0%;  left: 41%; transform: rotate(37deg); border-bottom-color: rgba(74, 222, 128, 0.5);   border-top-color: transparent; animation-delay: 1.45s; }
        .w-15 { bottom: -4%; left: 44%; transform: rotate(40deg); border-bottom-color: rgba(163, 230, 53, 0.45); border-top-color: transparent; animation-delay: 1.7s; }
        .w-16 { bottom: -8%; left: 47%; transform: rotate(43deg); border-bottom-color: rgba(217, 249, 157, 0.4);  border-top-color: transparent; animation-delay: 1.95s; }

        /* ---------- Layout (unchanged) ---------- */
        .site-stage {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1520px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .site-top-title {
            font-size: clamp(1.7rem, 3vw, 2.5rem);
            font-weight: 900;
            letter-spacing: 0.14em;
            color: #f0fdf4;
            text-align: center;
        }

        .monitor-layout {
            width: 100%;
            display: grid;
            grid-template-columns: 145px minmax(0, 1fr);
            gap: 22px;
            align-items: center;
        }

        .side-categories-column {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 14px;
        }

        .side-cat-btn {
            background: transparent;
            border: none;
            padding: 4px 0;
            color: #f8fafc;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.03em;
            cursor: pointer;
            text-align: left;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .side-cat-btn:hover,
        .side-cat-btn.active {
            color: #86efac;
            transform: translateX(6px) scale(1.06);
        }

        .monitor-device {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .monitor-bezel {
            width: 100%;
            aspect-ratio: 21 / 9.8;
            min-height: 510px;
            background: #14171f;
            border: 12px solid #1f2430;
            border-radius: 14px;
            box-shadow: 0 28px 70px rgba(0, 0, 0, 0.65);
            overflow: hidden;
            position: relative;
        }

        /* ---------- Screen ---------- */
        .monitor-screen {
            --info-w: clamp(235px, 24%, 320px);
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(120% 100% at 30% 20%, #f1efea, #e4e1da);
            color: #0f172a;
            overflow: hidden;
        }

        .screen-top-bar {
            position: absolute;
            top: 14px;
            left: 20px;
            z-index: 12;
            font-size: 0.66rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            color: #475569;
            pointer-events: none;
        }

        /* Stage holding the 27° rail */
        .rack-stage {
            position: absolute;
            inset: 0 auto 0 0;
            width: calc(100% - var(--info-w) - 30px);
            overflow: hidden;
            touch-action: pan-y;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            z-index: 5;
        }

        .rack-stage.dragging { cursor: grabbing; }

        /* Plane is rotated 27deg; rail + items live inside it */
        .rack-plane {
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            transform: rotate(27deg);
            transform-origin: 0 0;
        }

        .angled-rack-rail {
            position: absolute;
            top: -2px;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, #0f172a, #334155 60%, #0f172a);
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.25);
            z-index: 0;
        }

        /* Hanging piece */
        .rack-hanger-card {
            position: absolute;
            left: 0;
            top: 0;
            width: var(--tw, 200px);
            margin-left: calc(var(--tw, 200px) / -2);
            transform-origin: 50% 0;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            visibility: hidden;
            will-change: transform, opacity;
            -webkit-tap-highlight-color: transparent;
        }

        .rack-hanger-card:focus-visible { outline: 3px solid #16a34a; outline-offset: 4px; border-radius: 8px; }

        .rk-hook {
            position: absolute;
            left: 50%;
            top: -14px;
            width: 22px;
            height: 30px;
            margin-left: -11px;
            z-index: 2;
            pointer-events: none;
        }

        .rk-tag {
            position: absolute;
            left: 50%;
            top: -38px;
            transform: translateX(-50%) scale(.8);
            opacity: 0;
            background: #0f172a;
            color: #86efac;
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 0.08em;
            padding: 3px 9px;
            border-radius: 999px;
            white-space: nowrap;
            transition: opacity .25s ease, transform .25s ease;
            pointer-events: none;
        }

        .rack-hanger-card.active .rk-tag { opacity: 1; transform: translateX(-50%) scale(1); }

        .rack-hanger-card .gm {
            display: block;
            width: 100%;
            height: calc(var(--tw, 200px) * 1.1);
            margin-top: 12px;
            object-fit: contain;
            transition: transform .22s ease, filter .22s ease;
            pointer-events: none;
        }

        .rack-hanger-card.near .gm { filter: drop-shadow(10px 6px 11px rgba(15, 23, 42, 0.32)); }
        .rack-hanger-card:hover .gm { transform: translateY(-6px); }
        .rack-hanger-card.active .gm {
            filter: drop-shadow(0 0 2px #16a34a) drop-shadow(0 0 2px #16a34a) drop-shadow(0 16px 16px rgba(15, 23, 42, 0.38));
            transform: translateY(-4px);
        }

        /* ---------- Right detail card (inside screen) ---------- */
        .info-card {
            position: absolute;
            top: 50%;
            right: 22px;
            transform: translateY(-50%);
            width: var(--info-w);
            max-height: calc(100% - 28px);
            overflow-y: auto;
            z-index: 20;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.64);
            border: 1px solid rgba(15, 23, 42, 0.14);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            color: #0f172a;
            scrollbar-width: thin;
        }

        .info-count {
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: #475569;
        }

        .info-title {
            font-size: clamp(1.05rem, 1.7vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            line-height: 1.25;
            color: #0f172a;
        }

        .info-rule { width: 20px; height: 1px; background: #475569; }

        .info-meta {
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: #15803d;
        }

        .info-desc {
            font-size: 0.78rem;
            line-height: 1.6;
            color: #475569;
        }

        .info-specs { display: grid; gap: 5px; }

        .info-specs div {
            display: grid;
            grid-template-columns: 74px 1fr;
            gap: 8px;
            align-items: center;
            font-size: 0.7rem;
        }

        .info-specs dt { color: #64748b; letter-spacing: 0.1em; font-weight: 700; }
        .info-specs dd { color: #0f172a; font-weight: 800; letter-spacing: 0.04em; }

        .color-dot {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            border: 1px solid rgba(15, 23, 42, 0.35);
            margin-right: 6px;
            vertical-align: -1px;
        }

        .size-row { display: flex; flex-wrap: wrap; gap: 5px; }

        .size-chip {
            min-width: 34px;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #0f172a;
            background: transparent;
            color: #0f172a;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            transition: background .15s ease, color .15s ease;
        }

        .size-chip[aria-pressed="true"] { background: #0f172a; color: #86efac; }

        .detail-price-tag {
            font-size: 1.4rem;
            font-weight: 900;
            color: #15803d;
            letter-spacing: 0.02em;
        }

        .screen-btn {
            background: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
        }

        .screen-btn:hover { transform: translateY(-1px); }
        .screen-btn:active { transform: scale(.97); }
        .screen-btn.green { background: #16a34a; width: 100%; }

        .info-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .info-nav .screen-btn { padding: 6px 14px; font-size: 1rem; line-height: 1; }
        .info-nav .info-count { color: #0f172a; }

        .monitor-stand {
            width: 120px;
            height: 64px;
            background: linear-gradient(180deg, #252a37, #171a22);
        }

        .monitor-base {
            width: 270px;
            height: 14px;
            border-radius: 999px;
            background: linear-gradient(180deg, #2b3140, #191d26);
        }

        @media (prefers-reduced-motion: reduce) {
            .wire-wave { animation: none; }
            .rack-hanger-card .gm, .rk-tag, .size-chip, .screen-btn { transition: none; }
        }

        @media (max-width: 900px) {
            .monitor-layout { grid-template-columns: 1fr; }

            .side-categories-column {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 16px;
            }

            .monitor-bezel {
                aspect-ratio: auto;
                min-height: 0;
                border-width: 8px;
            }

            .monitor-screen { height: auto; display: flex; flex-direction: column; }

            .rack-stage {
                position: relative;
                inset: auto;
                width: 100%;
                height: 350px;
                flex: none;
            }

            .screen-top-bar { top: 10px; left: 14px; }

            .info-card {
                position: static;
                transform: none;
                width: auto;
                max-height: none;
                margin: 0 12px 14px;
            }
        }
    </style>
</head>

<body data-template="shop-tshirt" data-template-version="1.0.0">

    <div class="site-wires-bg" aria-hidden="true">
        <span class="wire-wave w-1"></span>
        <span class="wire-wave w-2"></span>
        <span class="wire-wave w-3"></span>
        <span class="wire-wave w-4"></span>
        <span class="wire-wave w-5"></span>
        <span class="wire-wave w-6"></span>
        <span class="wire-wave w-7"></span>
        <span class="wire-wave w-8"></span>
        <span class="wire-wave w-9"></span>
        <span class="wire-wave w-10"></span>
        <span class="wire-wave w-11"></span>
        <span class="wire-wave w-12"></span>
        <span class="wire-wave w-13"></span>
        <span class="wire-wave w-14"></span>
        <span class="wire-wave w-15"></span>
        <span class="wire-wave w-16"></span>
    </div>

    <main class="site-stage">
        <h1 class="site-top-title" data-editable="site_title" data-editable-type="text">
            SHOP T-SHIRT
        </h1>

        <div class="monitor-layout">
            <aside class="side-categories-column" aria-label="Categories">
                <button type="button" class="side-cat-btn active" data-cat="all">All Items</button>
                <button type="button" class="side-cat-btn" data-cat="tshirt">T-Shirt</button>
                <button type="button" class="side-cat-btn" data-cat="pants">Pants</button>
                <button type="button" class="side-cat-btn" data-cat="hoodie">Hoodie</button>
                <button type="button" class="side-cat-btn" data-cat="jacket">Jacket</button>
            </aside>

            <div class="monitor-device">
                <div class="monitor-bezel">
                    <div class="monitor-screen" id="monitorScreen">
                        <div class="screen-top-bar">SHOP T-SHIRT &nbsp;·&nbsp; COLLECTION / 01</div>

                        <!-- 27° display rail -->
                        <div class="rack-stage" id="rackTrack" role="listbox" aria-label="Hanging rack, use arrow keys">
                            <div class="rack-plane" id="rackPlane">
                                <div class="angled-rack-rail" id="rackRail" aria-hidden="true"></div>
                            </div>
                        </div>

                        <!-- Right-side vertical detail card -->
                        <aside class="info-card" id="teeDetailsBar" aria-live="polite">
                            <div class="info-count" data-counter id="rackCounter">01 / 40</div>
                            <h2 class="info-title" id="detailTitle">Studio Tee #01</h2>
                            <div class="info-rule" aria-hidden="true"></div>
                            <div class="info-meta" id="detailMeta">NO. 01 • T-SHIRT</div>
                            <p class="info-desc" id="detailDesc"></p>
                            <dl class="info-specs">
                                <div><dt>MATERIAL</dt><dd id="detailMaterial">320 GSM Combed Cotton</dd></div>
                                <div><dt>COLOR</dt><dd id="detailColor"></dd></div>
                            </dl>
                            <div class="size-row" id="detailSizes" role="group" aria-label="Sizes"></div>
                            <div class="detail-price-tag" id="detailPrice">$39</div>
                            <button type="button" class="screen-btn green" id="addTeeBtn">Add to Cart (<span id="cartQty">0</span>)</button>
                            <div class="info-nav">
                                <button type="button" class="screen-btn" id="prevTeeBtn" aria-label="Previous">←</button>
                                <span class="info-count" data-counter>01 / 40</span>
                                <button type="button" class="screen-btn" id="nextTeeBtn" aria-label="Next">→</button>
                            </div>
                        </aside>
                    </div>
                </div>
                <div class="monitor-stand" aria-hidden="true"></div>
                <div class="monitor-base" aria-hidden="true"></div>
            </div>
        </div>
    </main>

    <script>
        (() => {
            const MAX_ITEMS = 40;
            const CATEGORIES = ['tshirt', 'pants', 'hoodie', 'jacket'];
            const QUALITIES = [
                '320 GSM Combed Cotton',
                '340 GSM Heavy Jersey',
                '290 GSM Ring-Spun Cotton',
                '310 GSM Boxy Weave'
            ];
            const DESCRIPTIONS = {
                tshirt: 'Relaxed everyday tee cut from dense, soft-hand cotton with a clean ribbed collar.',
                pants: 'Tapered cargo pant with articulated knees and a washed, structured finish.',
                hoodie: 'Heavyweight brushed-fleece hoodie with a boxy fit and a double-lined hood.',
                jacket: 'Lightweight shell jacket with a water-repellent finish and matte hardware.'
            };
            /* 20 distinct colors; stepping by 7 keeps neighbours strongly contrasting */
            const COLORS = [
                ['Crimson', '#d62839'], ['Tangerine', '#f77f00'], ['Mustard', '#e9b72b'], ['Lime', '#9bc53d'],
                ['Emerald', '#1b9e5a'], ['Teal', '#0f8b8d'], ['Sky', '#4cc9f0'], ['Cobalt', '#2f5bea'],
                ['Navy', '#1d2b53'], ['Violet', '#7b3fe4'], ['Magenta', '#d6336c'], ['Blush', '#f4a6b8'],
                ['Snow', '#f5f3ee'], ['Sand', '#d8c3a5'], ['Stone', '#9ca3af'], ['Charcoal', '#2f343b'],
                ['Black', '#111214'], ['Chocolate', '#6b3f2a'], ['Olive', '#707a2f'], ['Burgundy', '#7a1f35']
            ];
            const RAIL_ANGLE = 27;
            const COS = Math.cos(RAIL_ANGLE * Math.PI / 180);
            const SIN = Math.sin(RAIL_ANGLE * Math.PI / 180);
            const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const $ = s => document.querySelector(s);
            const pad2 = n => String(n).padStart(2, '0');
            const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

            /* ---------- Garment silhouettes (SVG sprite) ---------- */
            const SHAPES = {
                tshirt: {
                    d: ['M33 8 7 23l10 19 9-5v66h48V37l9 5 10-19L67 8Q50 25 33 8Z'],
                    x: ['M33 8Q50 25 67 8']
                },
                hoodie: {
                    d: ['M32 16 8 30 4 88l15 3 5-36v52h52V55l5 36 15-3-4-58L68 16Q50 30 32 16Z', 'M33 15Q50-3 67 15Q50 38 33 15Z'],
                    x: ['M32 84h36l-4 14H36Z', 'M46 30v14M54 30v14']
                },
                jacket: {
                    d: ['M32 14 8 30 4 88l15 3 5-36v52h52V55l5 36 15-3-4-58L68 14 50 26Z'],
                    x: ['M50 26v80', 'M32 14l8 14 10-2M68 14l-8 14-10-2', 'M30 80h12M58 80h12']
                },
                pants: {
                    d: ['M27 8h46l8 98H55L50 44l-5 62H19Z'],
                    x: ['M27 17h46', 'M50 17v27']
                }
            };

            (function injectSprite() {
                const sym = Object.keys(SHAPES).map(k => {
                    const s = SHAPES[k];
                    return `<symbol id="g-${k}" viewBox="0 0 100 110">`
                        + s.d.map(d => `<path d="${d}" fill="currentColor"/><path d="${d}" fill="url(#gmShade)" stroke="rgba(0,0,0,.55)" stroke-width="1.6" stroke-linejoin="round"/>`).join('')
                        + s.x.map(d => `<path d="${d}" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1.4" stroke-linecap="round"/>`).join('')
                        + `</symbol>`;
                }).join('');
                document.body.insertAdjacentHTML('afterbegin',
                    `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
                        <linearGradient id="gmShade" x1="0" x2="1">
                            <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
                            <stop offset=".5" stop-color="#000" stop-opacity="0"/>
                            <stop offset="1" stop-color="#000" stop-opacity=".3"/>
                        </linearGradient></defs>${sym}</svg>`);
            })();

            /* ---------- Data (same shape as before + color/description) ---------- */
            const items = Array.from({ length: MAX_ITEMS }, (_, i) => {
                const index = i + 1;
                const indexLabel = pad2(index);
                const category = CATEGORIES[i % CATEGORIES.length];
                const quality = QUALITIES[i % QUALITIES.length];
                const titlePrefix = category === 'tshirt' ? 'Studio Tee'
                    : category === 'pants' ? 'Cargo Pant'
                    : category === 'hoodie' ? 'Heavy Hoodie'
                    : 'Shell Jacket';
                const col = COLORS[(i * 7) % COLORS.length];

                return {
                    id: `item-${indexLabel}`,
                    index,
                    indexLabel,
                    category,
                    name: `${titlePrefix} #${indexLabel}`,
                    price: 39 + (i % 8) * 4,
                    currency: '$',
                    quality,
                    sizes: 'S, M, L, XL',
                    color: col[0],
                    colorHex: col[1],
                    description: DESCRIPTIONS[category],
                    image: ''
                };
            });

            /* ---------- State ---------- */
            let activeCat = 'all';
            let selectedId = items[0].id;
            let cartCount = 0;
            let selectedSize = null;
            let list = [];
            let els = [];
            let vis = [];
            let nearFlags = [];
            let pos = 0;
            let target = 0;
            let raf = 0;
            let lastT = 0;
            let G = { tw: 200, A: 150, x0: 120, y0: 30 };

            const stage = $('#rackTrack');
            const plane = $('#rackPlane');
            const rail = $('#rackRail');

            const getFilteredItems = () => activeCat === 'all' ? items : items.filter(it => it.category === activeCat);

            /* ---------- Geometry ---------- */
            function layout() {
                const W = stage.clientWidth, H = stage.clientHeight;
                if (!W || !H) return;
                const mob = W < 560;
                const tw = Math.min(W * (mob ? 0.42 : 0.27), H * 0.46);
                const x0 = tw * 0.55 + W * 0.02;
                const y0 = H * 0.075;
                const A = Math.max(30, Math.min(W * 0.2, H * 0.34, (W * 0.95 - x0) / 4.05));
                G = { tw, A, x0, y0 };
                plane.style.left = x0 + 'px';
                plane.style.top = y0 + 'px';
                stage.style.setProperty('--tw', tw + 'px');
                rail.style.left = (-A * 1.4) + 'px';
                rail.style.width = (A * 6.6) + 'px';
                draw();
            }

            /* Overlapping stack: items compress and shrink along the 27° rail */
            function draw() {
                const { A } = G;
                const q = 0.78, inv = 1 / (1 - q);
                const act = clamp(Math.round(pos), 0, list.length - 1);

                for (let i = 0; i < els.length; i++) {
                    const d = i - pos, el = els[i];
                    if (d < -1.4 || d > 14) {
                        if (vis[i] !== 0) { el.style.visibility = 'hidden'; vis[i] = 0; }
                        continue;
                    }
                    if (vis[i] !== 1) { el.style.visibility = 'visible'; vis[i] = 1; }

                    const dist = d >= 0 ? A * (1 - Math.pow(q, d)) * inv : A * 1.13 * d;
                    const s = Math.pow(0.9, Math.max(d, 0));
                    const o = d < 0 ? Math.max(0, 1 + d / 1.4) : d > 10 ? Math.max(0, (14 - d) / 4) : 1;

                    el.style.transform = `translate3d(${dist.toFixed(1)}px,0,0) rotate(-${RAIL_ANGLE}deg) scale(${s.toFixed(3)})`;
                    el.style.opacity = o.toFixed(2);
                    el.style.zIndex = String(1000 - Math.round(d * 10));

                    const near = d < 6;
                    if (nearFlags[i] !== near) { el.classList.toggle('near', near); nearFlags[i] = near; }
                }

                if (list[act] && list[act].id !== selectedId) renderDetails(list[act]);
            }

            /* ---------- Motion (critically-damped easing, no libraries) ---------- */
            function tick(t) {
                const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
                lastT = t;
                const diff = target - pos;
                if (Math.abs(diff) < 0.0008) { pos = target; draw(); raf = 0; return; }
                pos += diff * (1 - Math.exp(-dt * 8));
                draw();
                raf = requestAnimationFrame(tick);
            }

            function moveTo(v, instant) {
                target = clamp(v, 0, Math.max(0, list.length - 1));
                if (RM || instant) {
                    if (raf) { cancelAnimationFrame(raf); raf = 0; }
                    pos = target; draw(); return;
                }
                if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(tick); }
            }

            function currentIndex() {
                return Math.max(0, list.findIndex(x => x.id === selectedId));
            }

            function select(i) {
                if (!list.length) return;
                i = clamp(i, 0, list.length - 1);
                renderDetails(list[i]);
                moveTo(i);
            }

            function stepBy(delta) {
                if (!list.length) return;
                select((currentIndex() + delta + list.length) % list.length);
            }

            /* ---------- Rendering ---------- */
            function garmentHTML(it) {
                if (it.image && it.image.trim()) {
                    return `<img class="gm" src="${esc(it.image.trim())}" alt="${esc(it.name)}" draggable="false">`;
                }
                return `<svg class="gm" viewBox="0 0 100 110" style="color:${esc(it.colorHex)}" aria-hidden="true"><use href="#g-${it.category}"/></svg>`;
            }

            function cardHTML(it, i) {
                return `<button type="button" class="rack-hanger-card" role="option" data-id="${it.id}" data-i="${i}" tabindex="-1"
                            aria-label="${esc(it.name)}, ${esc(it.color)}, ${it.currency}${it.price}">
                        <span class="rk-tag">#${it.indexLabel}</span>
                        <svg class="rk-hook" viewBox="0 0 24 30" aria-hidden="true">
                            <path d="M12 29V17c0-4 5-5 5-9a5 5 0 1 0-10 0" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
                        </svg>
                        ${garmentHTML(it)}
                    </button>`;
            }

            function renderDetails(item) {
                if (!item) return;
                const changed = item.id !== selectedId;
                selectedId = item.id;
                if (changed) selectedSize = null;

                $('#detailTitle').textContent = item.name;
                $('#detailMeta').textContent = `NO. ${item.indexLabel} • ${item.category.toUpperCase()}`;
                $('#detailDesc').textContent = item.description || '';
                $('#detailMaterial').textContent = item.quality;
                $('#detailColor').innerHTML = `<span class="color-dot" style="background:${esc(item.colorHex)}"></span>${esc(item.color)}`;
                $('#detailPrice').textContent = `${item.currency}${item.price}`;
                document.querySelectorAll('[data-counter]').forEach(n => {
                    n.textContent = `${item.indexLabel} / ${pad2(items.length)}`;
                });

                $('#detailSizes').innerHTML = String(item.sizes || '').split(',').map(s => s.trim()).filter(Boolean)
                    .map(s => `<button type="button" class="size-chip" data-size="${esc(s)}" aria-pressed="${s === selectedSize}">${esc(s)}</button>`).join('');

                els.forEach((el, i) => {
                    const on = list[i] && list[i].id === item.id;
                    el.classList.toggle('active', on);
                    el.setAttribute('aria-selected', on);
                    el.tabIndex = on ? 0 : -1;
                });
            }

            function renderRack(flourish) {
                list = getFilteredItems();
                if (!list.some(x => x.id === selectedId) && list.length) selectedId = list[0].id;

                els.forEach(e => e.remove());
                plane.insertAdjacentHTML('beforeend', list.map(cardHTML).join(''));
                els = Array.from(plane.querySelectorAll('.rack-hanger-card'));
                vis = []; nearFlags = [];

                const idx = currentIndex();
                if (raf) { cancelAnimationFrame(raf); raf = 0; }
                pos = target = idx;
                layout();
                renderDetails(list[idx]);

                if (flourish && !RM && list.length > 1) {
                    pos = Math.min(list.length - 1, idx + 3);
                    draw();
                    moveTo(idx);
                }
            }

            /* ---------- Input: drag along the 27° axis ---------- */
            let drag = null;

            stage.addEventListener('pointerdown', e => {
                if (e.button > 0) return;
                if (raf) { cancelAnimationFrame(raf); raf = 0; }
                target = pos;
                drag = { x: e.clientX, y: e.clientY, p: pos, moved: false, lx: e.clientX, ly: e.clientY, lt: performance.now(), v: 0 };
            });

            stage.addEventListener('pointermove', e => {
                if (!drag) return;
                const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                const proj = dx * COS + dy * SIN;
                if (!drag.moved && Math.abs(proj) > 6) {
                    drag.moved = true;
                    stage.setPointerCapture(e.pointerId);
                    stage.classList.add('dragging');
                }
                if (!drag.moved) return;

                const unit = G.A * 0.55;
                const now = performance.now();
                const dp = ((e.clientX - drag.lx) * COS + (e.clientY - drag.ly) * SIN) / unit;
                drag.v = -dp / Math.max(1, now - drag.lt);
                drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;

                pos = clamp(drag.p - proj / unit, -0.3, list.length - 0.7);
                target = pos;
                draw();
            });

            function endDrag() {
                if (!drag) return;
                const was = drag.moved, v = drag.v;
                drag = null;
                stage.classList.remove('dragging');
                if (was) select(Math.round(clamp(pos + v * 180, 0, list.length - 1)));
            }
            stage.addEventListener('pointerup', endDrag);
            stage.addEventListener('pointercancel', endDrag);

            /* Wheel / trackpad scroll over the rail */
            let wheelT = 0;
            stage.addEventListener('wheel', e => {
                const dlt = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                if (Math.abs(dlt) < 4) return;
                const next = currentIndex() + (dlt > 0 ? 1 : -1);
                if (next < 0 || next >= list.length) return;
                e.preventDefault();
                const now = performance.now();
                if (now - wheelT < 130) return;
                wheelT = now;
                select(next);
            }, { passive: false });

            /* Page scroll still maps to the rack when the page itself scrolls */
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
                    if (maxScroll > 40 && list.length) {
                        const progress = clamp(window.scrollY / maxScroll, 0, 1);
                        select(Math.round(progress * (list.length - 1)));
                    }
                    ticking = false;
                });
            }, { passive: true });

            /* Keyboard: ← / → */
            document.addEventListener('keydown', e => {
                const tag = (document.activeElement && document.activeElement.tagName) || '';
                if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
                if (e.key === 'ArrowRight') { e.preventDefault(); stepBy(1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); stepBy(-1); }
            });

            /* ---------- Clicks (categories, items, sizes, nav, cart) ---------- */
            document.addEventListener('click', e => {
                const catBtn = e.target.closest('.side-cat-btn');
                if (catBtn) {
                    activeCat = catBtn.dataset.cat || 'all';
                    document.querySelectorAll('.side-cat-btn').forEach(b => b.classList.toggle('active', b === catBtn));
                    renderRack(true);
                    return;
                }

                const card = e.target.closest('.rack-hanger-card');
                if (card) {
                    const i = list.findIndex(x => x.id === card.dataset.id);
                    if (i > -1) select(i);
                    return;
                }

                const chip = e.target.closest('.size-chip');
                if (chip) {
                    selectedSize = chip.dataset.size;
                    document.querySelectorAll('.size-chip').forEach(c => c.setAttribute('aria-pressed', c === chip));
                    return;
                }

                if (e.target.closest('#prevTeeBtn')) { stepBy(-1); return; }
                if (e.target.closest('#nextTeeBtn')) { stepBy(1); return; }

                if (e.target.closest('#addTeeBtn')) {
                    cartCount += 1;
                    document.getElementById('cartQty').textContent = String(cartCount);
                }
            });

            /* ---------- postMessage bridge (unchanged behaviour) ---------- */
            window.addEventListener('message', event => {
                const msg = event.data;
                if (!msg || typeof msg !== 'object') return;
                const target = items.find(x => x.id === msg.productId || x.id === msg.id || x.index === Number(msg.index));
                if (!target) return;

                if (msg.type === 'SET_PRODUCT_FIELD' && msg.field) {
                    target[msg.field] = msg.value;
                    renderRack();
                } else if (msg.type === 'SET_PRODUCT' && msg.changes) {
                    Object.assign(target, msg.changes);
                    renderRack();
                }
            });

            /* ---------- Public API (unchanged + small helpers) ---------- */
            window.ShopTshirtApp = {
                items,
                updateItem(id, changes) {
                    const found = items.find(x => x.id === id);
                    if (!found) return null;
                    Object.assign(found, changes);
                    renderRack();
                    return found;
                },
                select(id) {
                    const i = list.findIndex(x => x.id === id);
                    if (i > -1) select(i);
                },
                getCartCount() { return cartCount; }
            };

            if ('ResizeObserver' in window) new ResizeObserver(layout).observe(stage);
            else window.addEventListener('resize', layout);

            renderRack(true);
        })();
    </script>
</body>

</html>
